name: Test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run sample audit
        run: >-
          python -m fleet_readiness audit examples/inventory.json
          --policy examples/policy.json

      - name: Verify ready decommission plan
        run: >-
          python -m fleet_readiness decommission examples/inventory.json
          --host batch-dev-02

  workflow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install workflow auditor at a pinned commit
        run: >-
          python -m pip install
          "github-actions-workflow-auditor @ git+https://github.com/jjoseph456/github-actions-workflow-auditor@b2a2e460e87d947fd68eee383dd8ca24acf3e837"

      - name: Audit this repository's workflows
        run: workflow-audit . --fail-on low

