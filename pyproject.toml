[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-fleet-readiness"
version = "0.1.0"
description = "A dependency-free CLI for synthetic Linux fleet readiness audits and decommission planning."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Joseph P. Joseph"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
fleet-readiness = "fleet_readiness.cli:main"

[tool.setuptools.packages.find]
include = ["fleet_readiness*"]

